<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2f52"/>
      <stop offset="0.55" stop-color="#121c33"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#3d9bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3d9bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#a9d4ff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fa3ff"/>
      <stop offset="1" stop-color="#2d77d6"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4fa8"/>
      <stop offset="1" stop-color="#173f88"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e1ff"/>
      <stop offset="1" stop-color="#3d7bff"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- blueprint grid -->
    <g stroke="#7fb4ff" stroke-opacity="0.07" stroke-width="1.5">
      <path d="M8 56H248M8 104H248M8 152H248M8 200H248M56 8V248M104 8V248M152 8V248M200 8V248"/>
    </g>
    <circle cx="128" cy="140" r="120" fill="url(#glow)"/>
  </g>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- orbit, back half -->
  <g transform="rotate(-16 128 140)">
    <path d="M232 140 A104 32 0 0 0 24 140" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.45"/>
  </g>

  <!-- isometric part with a drilled hole -->
  <g stroke-linejoin="round">
    <path d="M128 58 L198 98 L128 138 L58 98 Z" fill="url(#top)"/>
    <path d="M58 98 L128 138 L128 214 L58 174 Z" fill="url(#left)"/>
    <path d="M198 98 L128 138 L128 214 L198 174 Z" fill="url(#right)"/>
    <!-- hole: dark opening with a lit inner wall -->
    <ellipse cx="128" cy="98" rx="24" ry="13.8" fill="#0e1a30"/>
    <path d="M104 98 A24 13.8 0 0 0 152 98 A24 13.8 0 0 1 104 98 Z" fill="#2b5fae" opacity="0.0"/>
    <path d="M152 98 A24 13.8 0 0 1 104 98 L104 104 A24 13.8 0 0 0 152 104 Z" fill="#3a7be0" opacity="0.55"/>
    <!-- crisp highlight edges -->
    <path d="M58 98 L128 138 L198 98" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"/>
    <path d="M128 138 L128 214" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- orbit, front half + marker -->
  <g transform="rotate(-16 128 140)">
    <path d="M232 140 A104 32 0 0 1 24 140" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="180" cy="167.7" r="10" fill="#ffb347" stroke="#0a0f1c" stroke-width="3"/>
  </g>
</svg>
